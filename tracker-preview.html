/li>\n<li>To load streaming data into an analytics service, such as Amazon Athena or Amazon Kinesis Analytics.<\/li>\n<\/ul>"},{"id":"aws-how-do-you-implement-high-availability-in-aws","title":"How do you implement high availability in AWS?","html":"<p>There are a number of ways to implement high availability in AWS. Some common methods include:<\/p>\n<ul>\n<li><strong>Redundancy:<\/strong> Deploy your applications and data across multiple Availability Zones (AZs). This will help to protect your applications and data from AZ outages.<\/li>\n<li><strong>Load balancing:<\/strong> Use load balancers to distribute traffic across your applications. This will help to improve the performance and availability of your applications.<\/li>\n<li><strong>Autoscaling:<\/strong> Use autoscaling to automatically scale your applications based on demand. This will help to ensure that your applications are always available to meet user demand.<\/li>\n<li><strong>Disaster recovery:<\/strong> Develop a disaster recovery plan to help you recover from a disaster, such as a regional outage or a natural disaster.<\/li>\n<\/ul>"},{"id":"aws-describe-the-use-cases-for-aws-greengrass","title":"Describe the use cases for AWS Greengrass.","html":"<p>AWS Greengrass is a service that extends AWS cloud capabilities to local devices. It allows devices to collect and analyze data closer to the source, while also securely communicating with each other on local networks.<\/p>\n<p>Some common use cases for AWS Greengrass include:<\/p>\n<ul>\n<li><strong>Industrial IoT:<\/strong> Greengrass can be used to connect and manage industrial IoT devices, such as sensors and actuators. This can be used to improve efficiency, reduce costs, and enable new products and services.<\/li>\n<li><strong>Smart cities:<\/strong> Greengrass can be used to connect and manage smart city infrastructure, such as traffic lights, public transportation, and waste management systems. This can be used to improve the quality of life for residents and businesses.<\/li>\n<li><strong>Retail:<\/strong> Greengrass can be used to connect and manage retail devices, such as smart carts, cameras, and mobile apps. This can be used to improve customer experience, increase sales, and reduce costs.<\/li>\n<li><strong>Healthcare:<\/strong> Greengrass can be used to connect and manage healthcare devices, such as wearable devices and medical equipment. This can be used to improve patient care, reduce costs, and enable new products and services.<\/li>\n<\/ul>"},{"id":"aws-what-is-aws-global-accelerator-and-when-is-it-used","title":"What is AWS Global Accelerator, and when is it used?","html":"<p>AWS Global Accelerator is a service that improves the performance and availability of your global applications. It routes user traffic over the AWS global network to the nearest healthy endpoint in your endpoint groups, which can reduce latency and improve availability for users around the world.<\/p>\n<p>Global Accelerator is a good choice for applications that need to be highly available and performant for users around the world. It is also a good choice for applications that have a lot of dynamic content, such as streaming video and live events.<\/p>"},{"id":"aws-how-do-you-secure-data-in-amazon-s3-buckets","title":"How do you secure data in Amazon S3 buckets?","html":"<p>There are a number of ways to secure data in Amazon S3 buckets. Some common methods include:<\/p>\n<ul>\n<li><strong>Server-side encryption (SSE):<\/strong> SSE encrypts your data at rest in S3. You can choose to encrypt your data using AWS managed keys or your own encryption keys.<\/li>\n<li><strong>Client-side encryption (CSE):<\/strong> CSE encrypts your data before it is uploaded to S3. You can choose to encrypt your data using AWS managed keys or your own encryption keys.<\/li>\n<li><strong>Bucket policies:<\/strong> Bucket policies can be used to control access to your S3 buckets. You can use bucket policies to restrict who can access your buckets and what they can do with them.<\/li>\n<li><strong>Object ACLs:<\/strong> Object ACLs can be used to control access to individual objects in your S3 buckets. You can use object ACLs to restrict who can access the objects and what they can do with them.<\/li>\n<\/ul>"},{"id":"aws-explain-the-concept-of-aws-elemental-mediaconvert","title":"Explain the concept of AWS Elemental MediaConvert.","html":"<p>AWS Elemental MediaConvert is a service that converts video files from one format to another. MediaConvert can also be used to generate thumbnails, transcode audio, and create captions.<\/p>\n<p>MediaConvert is a good choice for converting video files for different devices and platforms. It is also a good choice for generating thumbnails and transcoding audio.<\/p>"},{"id":"aws-what-is-amazon-documentdb-and-how-does-it-differ-from-mongodb","title":"What is Amazon DocumentDB, and how does it differ from MongoDB?","html":"<p>Amazon DocumentDB is a fully managed document database service that is compatible with MongoDB. DocumentDB provides a scalable, reliable, and secure way to run MongoDB workloads.<\/p>\n<p>The main difference between DocumentDB and MongoDB is that DocumentDB is fully managed. This means that AWS is responsible for managing the infrastructure and software for your DocumentDB instances.<\/p>\n<p>DocumentDB is a good choice for running MongoDB workloads that require high scalability, reliability, and security.<\/p>"},{"id":"aws-how-do-you-create-a-vpc-peering-connection-in-aws","title":"How do you create a VPC peering connection in AWS?","html":"<p>To create a VPC peering connection in AWS, follow these steps:<\/p>\n<ol>\n<li>Open the Amazon VPC console.<\/li>\n<li>In the navigation pane, choose <strong>Peering connections<\/strong>.<\/li>\n<li>Choose <strong>Create peering connection<\/strong>.<\/li>\n<li>Choose the VPC that you want to peer with.<\/li>\n<li>Choose the VPC that you want to accept the peering connection.<\/li>\n<li>Choose <strong>Create peering connection<\/strong>.<\/li>\n<li>The owner of the accepter VPC must accept the peering connection. Once the peering connection is accepted, it is active.<\/li>\n<\/ol>"},{"id":"aws-describe-the-features-of-aws-lambda-edge","title":"Describe the features of AWS Lambda@Edge.","html":"<p>AWS Lambda@Edge is a service that allows you to run Lambda functions at the edge of the AWS network. This allows you to process data and deliver content closer to your users, which can improve performance and reduce latency.<\/p>\n<p>Some of the features of AWS Lambda@Edge include:<\/p>\n<ul>\n<li><strong>Low latency:<\/strong> Lambda@Edge functions are executed at the edge of the AWS network, close to your users. This can reduce latency and improve performance for your users.<\/li>\n<li><strong>Global reach:<\/strong> Lambda@Edge functions can be deployed to edge locations around the world. This allows you to deliver content and process data closer to your users, regardless of where they are located.<\/li>\n<li><strong>Scalability:<\/strong> Lambda@Edge functions can scale automatically to meet demand. This means that your applications can handle sudden spikes in traffic without any intervention from you.<\/li>\n<\/ul>"},{"id":"aws-what-is-aws-fargate-and-how-is-it-different-from-ecs","title":"What is AWS Fargate and how is it different from ECS?","html":"<p>AWS Fargate is a serverless compute engine for Docker containers. AWS ECS is a container orchestration service that helps you to deploy, manage, and scale containerized applications.<\/p>"},{"id":"aws-fargate-vs-ecs","title":"Fargate vs. ECS","html":"<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Fargate<\/th>\n<th>ECS<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Serverless<\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Container orchestration<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Scaling<\/td>\n<td>Task count managed by ECS Service Auto Scaling<\/td>\n<td>EC2 Auto Scaling groups<\/td>\n<\/tr>\n<tr>\n<td>Pricing<\/td>\n<td>Pay-as-you-go<\/td>\n<td>Pay-as-you-go<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"id":"aws-how-does-aws-artifact-enhance-compliance-and-security","title":"How does AWS Artifact enhance compliance and security?","html":"<p>AWS Artifact enhances compliance and security in a number of ways.<\/p>\n<p><strong>Compliance<\/strong><\/p>\n<ul>\n<li>AWS Artifact provides on-demand access to AWS security and compliance reports, such as SOC and ISO reports, as well as compliance agreements. This makes it easy to find and access the documents you need when preparing for audits.<\/li>\n<li>AWS Artifact provides a variety of reports that can help you demonstrate compliance with specific AWS services and regulations.<\/li>\n<li>AWS Artifact makes it easy to track the status of your AWS agreements, such as the Business Associate Addendum (BAA). This can help you ensure that you are always in compliance with your AWS agreements.<\/li>\n<\/ul>\n<p><strong>Security<\/strong><\/p>\n<ul>\n<li>AWS Artifact uses a variety of security measures to protect your data, including encryption, access control, and auditing.<\/li>\n<li>AWS Artifact integrates with AWS Identity and Access Management (IAM) to ensure that only authorized users can access your data.<\/li>\n<li>AWS Artifact logs all activity to CloudTrail, so that you can audit who accessed your data and what they did with it.<\/li>\n<\/ul>\n<p>Here are some specific examples of how AWS Artifact can be used to enhance compliance and security:<\/p>\n<ul>\n<li>A healthcare organization can use AWS Artifact to store and manage its HIPAA compliance documents. This can help the organization prepare for HIPAA audits and demonstrate compliance with HIPAA regulations.<\/li>\n<li>A financial services organization can use AWS Artifact to store and manage its PCI DSS compliance documents. This can help the organization prepare for PCI DSS audits and demonstrate compliance with PCI DSS regulations.<\/li>\n<li>A government organization can use AWS Artifact to store and manage its FedRAMP compliance documents. This can help the organization prepare for FedRAMP audits and demonstrate compliance with FedRAMP requirements.<\/li>\n<\/ul>\n<p>AWS Artifact is a powerful tool that can help AWS customers of all sizes enhance their compliance and security posture.<\/p>"},{"id":"aws-what-is-aws-privatelink-and-how-does-it-improve-network-security","title":"What is AWS PrivateLink, and how does it improve network security?","html":"<p>AWS PrivateLink is a service that allows you to securely connect your VPC to AWS services and other VPCs without using the public internet. PrivateLink traffic stays on the AWS network; for end-to-end protection of application payloads, use TLS or another application-level encryption.<\/p>\n<p>PrivateLink improves network security by providing a private and encrypted way to connect your VPC to AWS services and other VPCs. This helps to reduce the risk of data breaches and other security attacks.<\/p>"},{"id":"aws-explain-the-use-of-aws-greengrass-core","title":"Explain the use of AWS Greengrass Core.","html":"<p><strong>AWS Greengrass Core<\/strong> is a software agent that runs on local devices and enables them to communicate with AWS cloud services. It provides local compute, messaging, data caching, and synchronization capabilities. Greengrass Core also provides security features such as encryption and authentication.<\/p>\n<p>Greengrass Core can be used in a variety of ways, including:<\/p>\n<ul>\n<li>To run machine learning models on edge devices<\/li>\n<li>To collect and analyze data from edge devices<\/li>\n<li>To control edge devices from the cloud<\/li>\n<li>To provide local caching and synchronization for edge devices<\/li>\n<\/ul>"},{"id":"aws-how-do-you-set-up-aws-single-sign-on-sso","title":"How do you set up AWS Single Sign-On (SSO)?","html":"<p>To set up AWS IAM Identity Center (the successor to AWS SSO), you enable it in your organization, connect your identity source, and then assign users and groups to accounts and applications through permission sets.<\/p>\n<p>Once you have configured AWS SSO, you can enable users to log in to your applications using their AWS SSO credentials.<\/p>"},{"id":"aws-what-is-aws-cost-explorer-and-how-does-it-help-in-cost-analysis","title":"What is AWS Cost Explorer, and how does it help in cost analysis?","html":"<p>AWS Cost Explorer is a service that helps you to analyze your AWS costs. Cost Explorer provides a variety of reports and dashboards that can help you to understand your costs, identify areas where you can save money, and optimize your AWS usage.<\/p>\n<p>Cost Explorer can be used by a variety of users, including:<\/p>\n<ul>\n<li><strong>Finance professionals:<\/strong> Cost Explorer can help finance professionals to understand the cost of AWS usage and to identify areas where they can save money.<\/li>\n<li><strong>IT professionals:<\/strong> Cost Explorer can help IT professionals to optimize AWS usage and to troubleshoot cost spikes.<\/li>\n<li><strong>Business users:<\/strong> Cost Explorer can help business users to understand the cost of their AWS usage and to make informed decisions about AWS resource allocation.<\/li>\n<\/ul>"},{"id":"aws-describe-the-use-cases-for-aws-organizations","title":"Describe the use cases for AWS Organizations.","html":"<p>AWS Organizations is a service that helps you to manage multiple AWS accounts in a single place. Organizations provides a centralized way to create, manage, and audit AWS accounts.<\/p>\n<p>AWS Organizations can be used by a variety of users, including:<\/p>\n<ul>\n<li><strong>Enterprise IT administrators:<\/strong> Organizations can help enterprise IT administrators to manage multiple AWS accounts in a centralized and efficient way.<\/li>\n<li><strong>Managed service providers (MSPs):<\/strong> Organizations can help MSPs to manage their customers' AWS accounts in a centralized and efficient way.<\/li>\n<li><strong>Non-profit organizations:<\/strong> Organizations can help non-profit organizations to manage their AWS accounts in a centralized and efficient way.<\/li>\n<\/ul>"},{"id":"aws-what-is-the-aws-cdk-cloud-development-kit","title":"What is the AWS CDK (Cloud Development Kit)?","html":"<p>AWS CDK is a software development framework that allows you to define your AWS infrastructure as code. CDK supports a variety of programming languages, including Python, TypeScript, and Java.<\/p>\n<p>CDK can be used by a variety of developers, including:<\/p>\n<ul>\n<li><strong>Infrastructure engineers:<\/strong> CDK can help infrastructure engineers to define and manage their AWS infrastructure as code.<\/li>\n<li><strong>Software developers:<\/strong> CDK can help software developers to deploy and manage their AWS infrastructure as code.<\/li>\n<li><strong>DevOps engineers:<\/strong> CDK can help DevOps engineers to automate the deployment and management of AWS infrastructure.<\/li>\n<\/ul>"},{"id":"aws-how-do-you-implement-cross-account-access-in-aws","title":"How do you implement cross-account access in AWS?","html":"<p>There are two main ways to implement cross-account access in AWS:<\/p>\n<ol>\n<li><strong>Role-based access control (RBAC):<\/strong> RBAC allows users in one AWS account to access resources in another account. You create a role in the target account with a trust policy that allows the source principal to assume it, and then grant the source identity permission to assume that role.<\/li>\n<li><strong>Resource-based policies:<\/strong> Resource-based policies allow you to specify who can access specific resources in your account. To do this, you attach a resource-based policy to the resource that you want to share.<\/li>\n<\/ol>"},{"id":"aws-explain-the-difference-between-amazon-kinesis-data-streams-and-kinesis","title":"Explain the difference between Amazon Kinesis Data Streams and Kinesis Data Analytics.","html":"<p>Amazon Kinesis Data Streams is a real-time data streaming service that allows you to ingest and process streaming data from a variety of sources, such as web applications, sensors, and social media feeds. Kinesis Data Streams provides a durable and scalable platform for processing streaming data in real time.<\/p>\n<p>Amazon Kinesis Data Analytics was a fully managed service for processing and analyzing streaming data with SQL and Java (Apache Flink). AWS ended support for the SQL variant on January 27, 2026; the current service is Amazon Managed Service for Apache Flink.<\/p>"},{"id":"aws-what-is-aws-snowmobile-and-when-is-it-used","title":"What is AWS Snowmobile, and when is it used?","html":"<p>AWS Snowmobile was a petabyte-scale data transfer service that moved exabyte-scale data volumes in shipping containers. AWS retired Snowmobile in 2024; use AWS Snowball Edge or AWS DataSync for large data transfers instead.<\/p>"},{"id":"aws-how-do-you-use-aws-elastic-beanstalk-with-docker-containers","title":"How do you use AWS Elastic Beanstalk with Docker containers?","html":"<p>To use AWS Elastic Beanstalk with Docker containers, you first need to create a Docker image for your application. Once you have created a Docker image, you can deploy it to Elastic Beanstalk. Elastic Beanstalk will automatically provision and configure the resources that you need to run your Dockerized application.<\/p>"},{"id":"aws-describe-the-features-of-aws-control-tower","title":"Describe the features of AWS Control Tower.","html":"<p>AWS Control Tower is a service that helps you to set up and govern a secure, multi-account AWS environment. Control Tower provides a number of features to help you manage your AWS environment, including:<\/p>\n<ul>\n<li><strong>Account management:<\/strong> Control Tower helps you to create and manage AWS accounts.<\/li>\n<li><strong>Networking:<\/strong> Control Tower helps you to configure networking between your AWS accounts.<\/li>\n<li><strong>Security:<\/strong> Control Tower helps you to implement security best practices in your AWS environment.<\/li>\n<li><strong>Governance:<\/strong> Control Tower helps you to govern your AWS environment by providing a central place to manage your AWS policies and permissions.<\/li>\n<\/ul>"},{"id":"aws-what-is-the-aws-partner-network-apn-and-how-does-it-support-customers","title":"What is the AWS Partner Network (APN), and how does it support customers?","html":"<p>The AWS Partner Network (APN) is a global community of partners that leverage programs, expertise, and resources to build, market, and sell customer offerings. This diverse network features more than 130,000 partners from over 200 countries.<\/p>\n<p>The APN supports customers in a variety of ways, including:<\/p>\n<ul>\n<li><strong>Providing access to a wide range of AWS products and services:<\/strong> APN partners offer a wide range of AWS products and services, including consulting, implementation, and managed services. This gives customers a single point of contact for all of their AWS needs.<\/li>\n<li><strong>Helping customers to build and deploy AWS solutions:<\/strong> APN partners can help customers to build and deploy AWS solutions that meet their specific needs. APN partners can also help customers to migrate their existing applications to AWS.<\/li>\n<li><strong>Providing support and training:<\/strong> APN partners can provide support and training to customers on AWS products and services. This helps customers to get the most out of their AWS investments.<\/li>\n<\/ul>"},{"id":"aws-how-do-you-configure-amazon-cloudfront-with-ssl","title":"How do you configure Amazon CloudFront with SSL?","html":"<p>To configure Amazon CloudFront with SSL, you will need to create a CloudFront distribution and then configure the distribution to use SSL.<\/p>\n<p>To create a CloudFront distribution, follow these steps:<\/p>\n<ol>\n<li>Open the Amazon CloudFront console.<\/li>\n<li>In the navigation pane, choose <strong>Distributions<\/strong>.<\/li>\n<li>Choose <strong>Create Distribution<\/strong>.<\/li>\n<li>Choose the type of distribution that you want to create.<\/li>\n<li>Configure the distribution settings.<\/li>\n<li>Choose <strong>Create Distribution<\/strong>.<\/li>\n<\/ol>\n<p>Once you have created a CloudFront distribution, you can configure the distribution to use SSL. To do this, follow these steps:<\/p>\n<ol>\n<li>Open the Amazon CloudFront console.<\/li>\n<li>In the navigation pane, choose <strong>Distributions<\/strong>.<\/li>\n<li>Choose the distribution that you want to configure.<\/li>\n<li>In the <strong>Distribution Settings<\/strong> tab, choose <strong>Edit<\/strong>.<\/li>\n<li>In the <strong>SSL Certificate<\/strong> section, choose <strong>Custom SSL certificate<\/strong>.<\/li>\n<li>Choose a certificate from <strong>AWS Certificate Manager (ACM)<\/strong> or the IAM certificates store. Note that ACM certificates used with CloudFront must be requested or imported in the us-east-1 Region.<\/li>\n<li>Choose <strong>Save<\/strong>.<\/li>\n<\/ol>"},{"id":"aws-what-is-aws-opsworks-and-how-does-it-automate-infrastructure-managemen","title":"What is AWS OpsWorks, and how does it automate infrastructure management?","html":"<p>AWS OpsWorks helped you automate the deployment and management of your applications with configuration-management tools. Note that AWS retired OpsWorks in 2024 (OpsWorks Stacks on May 26, 2024, Chef Automate on May 5, 2024, and Puppet Enterprise on March 31, 2024), and recommends AWS Systems Manager for ongoing management:<\/p>\n<ul>\n<li><strong>Automatic deployment:<\/strong> OpsWorks can automatically deploy your applications to AWS.<\/li>\n<li><strong>Stack management:<\/strong> OpsWorks allows you to manage your applications as stacks. A stack is a collection of AWS resources that are used to run your application.<\/li>\n<li><strong>Monitoring and alerts:<\/strong> OpsWorks monitors your applications and sends you alerts if there are any problems.<\/li>\n<li><strong>Self-healing:<\/strong> OpsWorks can automatically heal your applications if they fail.<\/li>\n<\/ul>"},{"id":"aws-explain-the-aws-elastic-transcoder-service","title":"Explain the AWS Elastic Transcoder service.","html":"<p>AWS Elastic Transcoder was a service that encoded media files for delivery across a variety of devices and platforms, supporting formats such as MP4, HLS, and MPEG-DASH. AWS discontinued Elastic Transcoder on November 13, 2025, and recommends AWS Elemental MediaConvert for transcoding workloads.<\/p>\n<p>Elastic Transcoder can be used to encode media files for delivery on websites, mobile devices, and streaming devices. Elastic Transcoder can also be used to encode media files for long-term storage.<\/p>"},{"id":"aws-what-is-aws-transit-gateway-network-manager","title":"What is AWS Transit Gateway Network Manager?","html":"<p>AWS Transit Gateway Network Manager (part of AWS Network Manager) helps you to manage and visualize your AWS Transit Gateway networks. It provides a number of features to help you manage your Transit Gateway networks, including:<\/p>\n<ul>\n<li><strong>Network topology visualization:<\/strong> Transit Gateway Network Manager provides a graphical view of your Transit Gateway network topology. This helps you to understand how your network is connected and to identify potential problems.<\/li>\n<li><strong>Route analysis:<\/strong> Transit Gateway Network Manager includes a Route Analyzer that helps you analyze the routes in your Transit Gateway route tables. This helps you to understand and troubleshoot the flow of traffic in your network.<\/li>\n<li><strong>Monitoring and alerts:<\/strong> Transit Gateway Network Manager monitors your Transit Gateway network and sends you alerts if there are any problems.<\/li>\n<\/ul>"},{"id":"aws-how-does-aws-privatelink-work-with-service-endpoints","title":"How does AWS PrivateLink work with service endpoints?","html":"<p>AWS PrivateLink works with interface VPC endpoints to provide a private and secure way to connect your VPC to AWS services. Interface endpoints are elastic network interfaces powered by PrivateLink that allow you to connect to AWS services without using the public internet; gateway endpoints, by contrast, use route table entries for S3 and DynamoDB.<\/p>\n<p>When you create a service endpoint, you can choose to enable PrivateLink. If you enable PrivateLink, AWS will create a private connection between your VPC and the AWS service. This connection is isolated from the public internet and is only accessible to resources in your VPC.<\/p>"},{"id":"aws-describe-aws-dms-database-migration-service-and-its-use-cases","title":"Describe AWS DMS (Database Migration Service) and its use cases.","html":"<p>AWS DMS is a service that helps you to migrate your databases to AWS. DMS supports a variety of database types, including MySQL, PostgreSQL, Oracle, and SQL Server.<\/p>\n<p>DMS can be used to migrate databases for a variety of reasons, including:<\/p>\n<ul>\n<li><strong>To move to a more scalable and reliable platform:<\/strong> AWS DMS can help you to migrate your databases to AWS, which is a highly scalable and reliable platform.<\/li>\n<li><strong>To reduce costs:<\/strong> AWS DMS can help you to reduce the cost of running your databases by migrating them to AWS. DMS pricing is based on the replication instances and storage you use, and database discounts such as Reserved Instances or Savings Plans apply to the target databases.<\/li>\n<li><strong>To improve performance:<\/strong> AWS DMS can help you to improve the performance of your databases by migrating them to AWS. AWS offers a variety of high-performance database services, such as Amazon Aurora and Amazon RDS.<\/li>\n<\/ul>"},{"id":"aws-what-is-aws-chime-and-how-does-it-facilitate-video-conferencing","title":"What is AWS Chime, and how does it facilitate video conferencing?","html":"<p>Amazon Chime was a unified communications service that provided voice, video, messaging, and screen sharing capabilities. AWS ended support for the Amazon Chime service on February 20, 2026; the Amazon Chime SDK remains available for building custom meeting applications.<\/p>\n<p>Chime facilitates video conferencing by providing a number of features, including:<\/p>\n<ul>\n<li><strong>High-quality video and audio:<\/strong> Chime uses a global network of data centers to provide high-quality video and audio for your video conferencing meetings.<\/li>\n<li><strong>Screen sharing:<\/strong> Chime allows you to share your screen with other participants in your video conferencing meeting. This is useful for presenting slides or demonstrating software.<\/li>\n<li><strong>Meeting recording:<\/strong> Chime allows you to record your video conferencing meetings and share them with others. This is useful for creating training videos or sharing meetings with people who could not attend live.<\/li>\n<\/ul>"},{"id":"aws-how-do-you-use-aws-organizations-to-consolidate-billing","title":"How do you use AWS Organizations to consolidate billing?","html":"<p>AWS Organizations allows you to consolidate billing for your AWS accounts. This can be useful for organizations that have multiple AWS accounts and want to manage their billing centrally.<\/p>\n<p>To consolidate billing with AWS Organizations, you must create an organization and add your AWS accounts to the organization. Once you have added your AWS accounts to the organization, you can create a consolidated bill for all of your AWS accounts.<\/p>\n<p>To create a consolidated bill, follow these steps:<\/p>\n<ol>\n<li>In the AWS Billing and Cost Management console, choose <strong>Consolidated Billing<\/strong>.<\/li>\n<li>Choose <strong>Get started<\/strong> and sign in to the Organizations console.<\/li>\n<li>Create an organization and invite the AWS accounts you want to include.<\/li>\n<li>Accept the invitations from each account.<\/li>\n<\/ol>\n<p>Once the accounts have joined the organization, their usage is combined into a single bill that you can view and download from the AWS Billing and Cost Management console.<\/p>"},{"id":"aws-what-is-amazon-polly-and-how-does-it-convert-text-to-speech","title":"What is Amazon Polly, and how does it convert text to speech?","html":"<p>Amazon Polly is a cloud service that converts text to speech. It uses deep learning technologies to synthesize natural-sounding human speech. Polly supports a variety of languages and voices, and it can produce audio in formats such as MP3, Ogg Vorbis, and PCM; SSML can be used as input markup to control how the text is spoken.<\/p>\n<h4>How Amazon Polly converts text to speech<\/h4>\n<p>Amazon Polly converts text to speech by following these steps:<\/p>\n<ol>\n<li>It breaks the text down into individual words and phonemes.<\/li>\n<li>It synthesizes the phonemes into speech using a deep learning model.<\/li>\n<li>It applies post-processing techniques, such as prosody and intonation, to make the speech sound more natural.<\/li>\n<\/ol>"},{"id":"aws-explain-the-concept-of-aws-eventbridge","title":"Explain the concept of AWS EventBridge.","html":"<p>AWS EventBridge is a serverless event bus service that makes it easy to connect applications together and build event-driven applications. EventBridge delivers a stream of real-time events to targets such as AWS Lambda functions, Kinesis streams, and Amazon SNS topics.<\/p>"},{"id":"aws-how-to-use-aws-eventbridge","title":"How to use AWS EventBridge","html":"<p>To use AWS EventBridge, you first need to create an event rule. An event rule specifies the event pattern that EventBridge should match. Once you have created an event rule, you need to configure one or more targets for the rule. Targets are the resources that EventBridge will send events to when the event pattern matches.<\/p>"},{"id":"aws-how-do-you-use-aws-data-pipeline-for-data-integration","title":"How do you use AWS Data Pipeline for data integration?","html":"<p>AWS Data Pipeline helped orchestrate data-driven workflows between AWS services such as Amazon S3, Amazon Redshift, and Amazon DynamoDB, as well as on-premises systems. The service is now in maintenance mode and closed to new customers, so new workloads should use AWS Glue, Amazon MWAA, or AWS Step Functions instead.<\/p>\n<p>To use AWS Data Pipeline for data integration, you first need to create a pipeline definition. A pipeline definition specifies the data sources, data destinations, and data processing steps for your pipeline. Once you have created a pipeline definition, you can start the pipeline. Data Pipeline will then start moving data between the data sources and data destinations that you specified in the pipeline definition.<\/p>"},{"id":"aws-describe-the-features-of-aws-codeguru","title":"Describe the features of AWS CodeGuru","html":"<p>AWS CodeGuru is a service that helps you to improve the quality of your code. CodeGuru uses machine learning to analyze your code and identify potential problems, such as security vulnerabilities, performance bottlenecks, and bugs.<\/p>\n<h4>Features of AWS CodeGuru<\/h4>\n<p>AWS CodeGuru provides a number of features to help you improve the quality of your code, including:<\/p>\n<ul>\n<li><strong>Code reviews:<\/strong> CodeGuru automatically reviews your code and identifies potential problems.<\/li>\n<li><strong>Recommendations:<\/strong> CodeGuru provides recommendations on how to fix potential problems in your code.<\/li>\n<li><strong>Insights:<\/strong> CodeGuru provides insights into your code quality, such as the number of bugs and security vulnerabilities in your code.<\/li>\n<\/ul>"}]},{"id":"azure","name":"Azure","blurb":"Mostly questions without answers. Use the notes box to write your own.","color":["#0a6cbf","#5fb0f5"],"items":[{"id":"azure-what-is-microsoft-azure-and-how-does-it-work","title":"What is Microsoft Azure, and how does it work?","html":"<p>Microsoft Azure is a cloud computing platform that provides a wide range of services, like storage, computing, and databases, hosted in Microsoft data centers. It lets businesses build, deploy, and manage applications globally, using tools and frameworks of their choice.<\/p>"},{"id":"azure-explain-the-core-services-provided-by-azure","title":"Explain the core services provided by Azure.","html":"<p>Azure provides core services like Compute, which includes virtual machines and containers; Storage for data solutions like Blob and Disk Storage; Networking to manage connectivity with services like Virtual Network; and Databases including SQL Database and Cosmos DB. These core services help build, deploy, and manage applications in the cloud efficiently<\/p>"},{"id":"azure-what-is-azure-resource-manager-arm","title":"What is Azure Resource Manager (ARM)?","html":"<p>Azure Resource Manager (ARM) is a RESTful API and a deployment and management service for Azure. It provides a way to organize resources, apply access control, and manage them through templates. ARM ensures resources are deployed consistently and makes it easy to monitor and control access across all resources in a solution. Developers can use ARM to automate resource management tasks and enable a consistent and repeatable deployment process.<\/p>"},{"id":"azure-describe-the-differences-between-azure-iaas-paas-and-saas","title":"Describe the differences between Azure IaaS, PaaS, and SaaS.","html":""},{"id":"azure-how-does-azure-virtual-network-work-and-what-are-its-components","title":"How does Azure Virtual Network work, and what are its components?","html":""},{"id":"azure-what-is-microsoft-entra-id-formerly-azure-active-directory-and-how-is-","title":"What is Microsoft Entra ID (formerly Azure Active Directory), and how is it used?","html":""},{"id":"azure-explain-azure-app-service-and-its-use-cases","title":"Explain Azure App Service and its use cases.","html":""},{"id":"azure-how-does-azure-storage-work-and-what-are-its-types","title":"How does Azure Storage work, and what are its types?","html":""},{"id":"azure-describe-a ","html":""},{"id":"gcp-describe-the-use-of-google-cloud-resource-manager-for-organization-and","title":"Describe the use of Google Cloud Resource Manager for organization and project management.","html":""},{"id":"gcp-how-do-you-ensure-data-integrity-in-google-cloud-storage-and-databases","title":"How do you ensure data integrity in Google Cloud Storage and databases?","html":""},{"id":"gcp-what-is-google-cloud-filestore-and-how-does-it-provide-nfs-storage-for","title":"What is Google Cloud Filestore, and how does it provide NFS storage for applications?","html":""},{"id":"gcp-explain-the-concept-of-google-cloud-tasks-for-task-orchestration","title":"Explain the concept of Google Cloud Tasks for task orchestration.","html":""},{"id":"gcp-how-does-google-cloud-identity-platform-facilitate-user-authentication","title":"How does Google Cloud Identity Platform facilitate user authentication and identity management?","html":""},{"id":"gcp-what-is-google-cloud-video-intelligence-and-how-does-it-enable-video-c","title":"What is Google Cloud Video Intelligence, and how does it enable video content analysis?","html":""},{"id":"gcp-describe-the-benefits-of-google-cloud-healthcare-api-for-healthcare-da","title":"Describe the benefits of Google Cloud Healthcare API for healthcare data integration and analysis.","html":""}]},{"id":"aws-services","name":"AWS services","blurb":"Reference list. Check a service once you can say what it does and when to use it.","color":["#7a4bb0","#be9af0"],"items":[{"id":"aws-services-amazon-elastic-compute-cloud-ec2","title":"Amazon Elastic Compute Cloud (EC2)","html":"<p>Scalable virtual servers for running applications.<\/p>","group":"Compute"},{"id":"aws-services-aws-fargate","title":"AWS Fargate","html":"<p>Serverless compute engine for containers.<\/p>","group":"Compute"},{"id":"aws-services-aws-lambda","title":"AWS Lambda","html":"<p>Serverless compute service for running code without provisioning servers.<\/p>","group":"Compute"},{"id":"aws-services-amazon-simple-storage-service-s3","title":"Amazon Simple Storage Service (S3)","html":"<p>Object storage service for storing and retrieving data.<\/p>","group":"Storage"},{"id":"aws-services-amazon-elastic-block-store-ebs","title":"Amazon Elastic Block Store (EBS)","html":"<p>Block storage service for EC2 instances.<\/p>","group":"Storage"},{"id":"aws-services-amazon-elastic-file-system-efs","title":"Amazon Elastic File System (EFS)","html":"<p>A fully managed, scalable file system for use with Amazon Web Services (AWS) cloud services and on-premises resources.<\/p>","group":"Storage"},{"id":"aws-services-amazon-s3-glacier","title":"Amazon S3 Glacier","html":"<p>Low-cost archival storage classes of Amazon S3 for long-term data archiving (S3 Glacier Flexible Retrieval and S3 Glacier Deep Archive).<\/p>","group":"Storage"},{"id":"aws-services-amazon-s3-file-gateway","title":"Amazon S3 File Gateway","html":"<p>enables you to store file data as objects in Amazon S3 cloud storage for data lakes, backups, and ML workflows.<\/p>","group":"Storage"},{"id":"aws-services-amazon-relational-database-service-rds","title":"Amazon Relational Database Service (RDS)","html":"<p>Managed relational database service for SQL databases.<\/p>","group":"Databases"},{"id":"aws-services-amazon-aurora","title":"Amazon Aurora","html":"<p>Relational database service that is MySQL- and PostgreSQL-compatible.<\/p>","group":"Databases"},{"id":"aws-services-amazon-neptune","title":"Amazon Neptune","html":"<p>Managed graph database service.<\/p>","group":"Databases"},{"id":"aws-services-amazon-timestream","title":"Amazon Timestream","html":"<p>Fully managed, serverless time-series database.<\/p>","group":"Databases"},{"id":"aws-services-amazon-redshift","title":"Amazon Redshift","html":"<p>A fully managed, petabyte-scale data warehouse service in the cloud, designed to handle large analytical workloads with high performance and scalability. Redshift is built on top of massively parallel processing (MPP) technology, which allows it to distribute queries across multiple nodes to process data in parallel.<\/p>","group":"Databases"},{"id":"aws-services-amazon-dynamodb","title":"Amazon DynamoDB","html":"<p>A fully managed, serverless, key-value and document database service that provides single-digit millisecond performance at any scale.<\/p>","group":"Databases"},{"id":"aws-services-amazon-dynamodb-accelerator-dax","title":"Amazon DynamoDB Accelerator (DAX)","html":"<p>A fully managed, highly available, in-memory cache for DynamoDB that delivers up to 10x performance improvement.<\/p>","group":"Databases"},{"id":"aws-services-amazon-documentdb","title":"Amazon DocumentDB","html":"<p>Fully managed, scalable, highly available, and durable document database that supports MongoDB workloads.<\/p>","group":"Databases"},{"id":"aws-services-amazon-keyspaces-for-apache-cassandra","title":"Amazon Keyspaces (for Apache Cassandra)","html":"<p>A scalable, highly available, and managed Apache Cassandra–compatible database service.<\/p>","group":"Databases"},{"id":"aws-services-amazon-virtual-private-cloud-vpc","title":"Amazon Virtual Private Cloud (VPC)","html":"<p>Networking service to create isolated virtual networks.<\/p>","group":"Networking"},{"id":"aws-services-aws-vpc-peering","title":"AWS VPC peering","html":"<p>A networking connection between two VPCs that enables you to route traffic between them privately.<\/p>","group":"Networking"},{"id":"aws-services-elastic-load-balancing-elb","title":"Elastic Load Balancing (ELB)","html":"<p>Distributes incoming network traffic across multiple EC2 instances.<\/p>","group":"Networking"},{"id":"aws-services-amazon-route-53","title":"Amazon Route 53","html":"<p>Scalable and highly available Domain Name System (DNS) web service.<\/p>","group":"Networking"},{"id":"aws-services-aws-direct-connect","title":"AWS Direct Connect","html":"<p>A dedicated network connection from your on-premises data center to AWS.<\/p>","group":"Networking"},{"id":"aws-services-aws-transit-gateway","title":"AWS Transit Gateway","html":"<p>Service for connecting multiple VPCs and on-premises networks.<\/p>","group":"Networking"},{"id":"aws-services-aws-vpn-cloudhub","title":"AWS VPN CloudHub","html":"<p>A hub-and-spoke model that connects multiple on-premises sites through a virtual private gateway over Site-to-Site VPN connections, allowing remote offices to communicate with each other and with AWS.<\/p>","group":"Networking"},{"id":"aws-services-aws-transit-gateway-peering","title":"AWS Transit Gateway Peering","html":"<p>A service that allows you to connect two or more AWS Transit Gateways together.<\/p>","group":"Networking"},{"id":"aws-services-aws-transit-gateway-network-manager","title":"AWS Transit Gateway Network Manager","html":"<p>A service that provides a unified view of your AWS Transit Gateway networks and helps you manage them centrally.<\/p>","group":"Networking"},{"id":"aws-services-aws-global-accelerator","title":"AWS Global Accelerator","html":"<p>Improve application availability and performance using the AWS global network.<\/p>","group":"Networking"},{"id":"aws-services-aws-privatelink","title":"AWS PrivateLink","html":"<p>A secure way to connect two services that are running in a virtual private cloud (VPC) or on-premises network to services running in AWS.<\/p>","group":"Networking"},{"id":"aws-services-aws-client-vpn","title":"AWS Client VPN","html":"<p>Managed VPN for secure remote access to AWS and on-premises resources, allows to connect your devices to your AWS account over a secure encrypted tunnel.<\/p>","group":"Networking"},{"id":"aws-services-aws-vpc-endpoints","title":"AWS VPC endpoints","html":"<p>allow resources in a VPC to connect to AWS services without requiring an internet gateway, NAT device, VPN connection, or AWS Direct Connect connection. Interface endpoints are elastic network interfaces powered by AWS PrivateLink; gateway endpoints are route table targets for Amazon S3 and DynamoDB.<\/p>","group":"Networking"},{"id":"aws-services-amazon-cloudfront","title":"Amazon CloudFront","html":"<p>Content delivery network (CDN) for fast content delivery.<\/p>","group":"Content Delivery"},{"id":"aws-services-amazon-cloudfront-origin-access-control-oac","title":"Amazon CloudFront Origin Access Control (OAC)","html":"<p>OAC (the successor to Origin Access Identity) restricts access to an Amazon S3 origin so that content can only be served through the associated CloudFront distribution.<\/p>","group":"Content Delivery"},{"id":"aws-services-amazon-cloudfront-signed-url","title":"Amazon CloudFront Signed URL","html":"<p>A CloudFront signed URL is a URL that has been signed with a CloudFront signing key. This type of URL is used to restrict access to specific objects in CloudFront.<\/p>","group":"Content Delivery"},{"id":"aws-services-cloudfront-function","title":"CloudFront Function","html":"<p>A lightweight, JavaScript-only edge function that can modify or filter content at CloudFront edge locations; distinct from Lambda@Edge, which runs full Lambda functions.<\/p>","group":"Content Delivery"},{"id":"aws-services-amazon-cloudfront-distribution","title":"Amazon CloudFront Distribution","html":"<p>A CloudFront distribution is a collection of resources that are delivered to viewers by CloudFront. A distribution can include one or more origins, such as Amazon S3 buckets or Amazon EC2 instances.<\/p>","group":"Content Delivery"},{"id":"aws-services-amazon-cloudfront-edge-location","title":"Amazon CloudFront Edge Location","html":"<p>A CloudFront edge location is a server that is located around the world. Edge locations are used to cache content and deliver it to viewers with low latency.<\/p>","group":"Content Delivery"},{"id":"aws-services-amazon-simple-notification-service-sns","title":"Amazon Simple Notification Service (SNS)","html":"<p>Pub/sub messaging service for sending messages and notifications.<\/p>","group":"Messaging"},{"id":"aws-s ml":"<p>A service that helps you manage your software licenses across your AWS resources.<\/p>","group":"Management Tools"},{"id":"aws-services-aws-systems-manager-parameter-store","title":"AWS Systems Manager Parameter Store","html":"<p>Store and retrieve configuration data.<\/p>","group":"Management Tools"},{"id":"aws-services-amazon-kinesis-video-streams","title":"Amazon Kinesis Video Streams","html":"<p>Process and analyze video streams.<\/p>","group":"Media Services"},{"id":"aws-services-aws-migration-hub","title":"AWS Migration Hub","html":"<p>A service that helps you plan, migrate, and manage your migrations to AWS.<\/p>","group":"Migration"},{"id":"aws-services-aws-application-discovery-service-ads","title":"AWS Application Discovery Service (ADS)","html":"<p>A service that discovers applications running on your on-premises infrastructure, used to discover your on-premises applications and collect data about their dependencies, relationships, and usage patterns.<\/p>","group":"Migration"},{"id":"aws-services-amazon-database-migration-service-dms","title":"Amazon Database Migration Service (DMS)","html":"<p>A service that helps you migrate databases from on-premises to AWS or from one AWS database service to another.<\/p>","group":"Migration"},{"id":"aws-services-aws-application-migration-service-mgn","title":"AWS Application Migration Service (MGN)","html":"<p>Lift-and-shift applications to AWS with minimal downtime.<\/p>","group":"Migration"},{"id":"aws-services-aws-server-migration-service-sms","title":"AWS Server Migration Service (SMS)","html":"<p>AWS discontinued SMS in March 2022; its successor, AWS Application Migration Service (MGN, now AWS Transform MGN), automates lift-and-shift migrations with minimal downtime.<\/p>","group":"Migration"},{"id":"aws-services-aws-snowball","title":"AWS Snowball","html":"<p>Transfer large amounts of data to and from AWS using secure devices.<\/p>","group":"Migration"}]}]};
(function () {
  "use strict";
  var KEY_DONE = "cloudtrack:done:v1", KEY_NOTES = "cloudtrack:notes:v1", KEY_TRACK = "cloudtrack:track:v1";
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var done = load(KEY_DONE, {}), notes = load(KEY_NOTES, {});
  var tracks = DATA.tracks;
  var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  function colorOf(t) { return dark ? t.color[1] : t.color[0]; }
  var current = null, filter = "all", query = "";

  function el(tag, attrs, html) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (html != null) n.innerHTML = html;
    return n;
  }
  function doneCount(t) { return t.items.filter(function (i) { return done[i.id]; }).length; }
  function totals() {
    var n = 0, tot = 0;
    tracks.forEach(function (t) { n += doneCount(t); tot += t.items.length; });
    return [n, tot];
  }
  function byId(id) { return tracks.filter(function (t) { return t.id === id; })[0]; }

  /* ---- track list ---- */
  var nav = document.getElementById("tracks");
  function renderNav() {
    nav.innerHTML = "";
    tracks.forEach(function (t) {
      var n = doneCount(t), pct = t.items.length ? Math.round(100 * n / t.items.length) : 0;
      var b = el("button", { "class": "tab" + (n === t.items.length && n ? " complete" : ""), "data-t": t.id });
      b.style.setProperty("--tc", colorOf(t));
      b.setAttribute("aria-current", t === current ? "true" : "false");
      b.innerHTML = '<span class="nm">' + t.name + '</span><span class="ct">' + n + "/" + t.items.length +
        '</span><span class="meter"><i style="width:' + pct + '%"></i></span>';
      b.onclick = function () { openTrack(t.id); };
      nav.appendChild(b);
    });
    var tt = totals();
    document.getElementById("ov-n").textContent = tt[0];
    document.getElementById("ov-t").textContent = tt[1];
  }

  /* ---- one track ---- */
  var panel = document.getElementById("panel");
  function openTrack(id, keepFilters) {
    current = byId(id) || tracks[0];
    save(KEY_TRACK, current.id);
    if (location.hash.slice(1) !== current.id) history.replaceState(null, "", "#" + current.id);
    if (!keepFilters) { filter = "all"; query = ""; }
    renderNav(); renderPanel();
    window.scrollTo(0, 0);
  }

  function renderPanel() {
    var t = current;
    panel.innerHTML = "";
    panel.style.setProperty("--tc", colorOf(t));
    var head = el("section", { "class": "panel-head" });
    head.innerHTML = "<h2>" + t.name + "</h2><p>" + t.blurb + '</p><div class="count" aria-live="polite"><b id="c-n"></b><span id="c-t"></span></div><div class="ledger" id="ledger"></div>';
    panel.appendChild(head);

    var ctl = el("div", { "class": "controls" });
    ctl.innerHTML =
      '<input type="search" id="q" placeholder="Search this track" aria-label="Search this track">' +
      '<div class="seg" role="group" aria-label="Filter">' +
      '<button data-f="all">All</button><button data-f="todo">To do</button><button data-f="done">Done</button></div>' +
      '<button class="btn" id="next">Next unchecked</button>' +
      '<button class="btn" id="all">Mark all done</button>' +
      '<button class="btn danger" id="clear">Clear track</button>';
    panel.appendChild(ctl);

    var list = el("ol", { "class": "qs", id: "list" });
    var lastGroup = null, ledger = head.querySelector("#ledger");
    t.items.forEach(function (it, idx) {
      if (it.group && it.group !== lastGroup) {
        lastGroup = it.group;
        var g = el("li", { "class": "group", "data-group": "1" });
        g.textContent = it.group;
        list.appendChild(g);
      }
      var li = el("li", { "class": "q", id: "q-" + it.id, "data-id": it.id });
      var cb = el("input", { type: "checkbox", id: "cb-" + it.id });
      cb.setAttribute("aria-label", "Mark done: " + it.title.replace(/<[^>]+>/g, ""));
      cb.checked = !!done[it.id];
      cb.onchange = function () { setDone(it.id, cb.checked); };
      var d = el("details");
      var s = el("summary", null, it.title);
      var body = el("div", { "class": "body" }, it.html);
      var nw = el("div", { "class": "notes" });
      var nl = el("label", { "for": "n-" + it.id }); nl.textContent = "Your notes";
      var ta = el("textarea", { id: "n-" + it.id });
      ta.value = notes[it.id] || "";
      ta.oninput = function () {
        if (ta.value) notes[it.id] = ta.value; else delete notes[it.id];
        save(KEY_NOTES, notes);
      };
      nw.appendChild(nl); nw.appendChild(ta);
      d.appendChild(s); d.appendChild(body); d.appendChild(nw);
      li.appendChild(cb); li.appendChild(d);
      list.appendChild(li);

      var c = el("button", { "class": "cell", "data-id": it.id });
      c.title = it.title.replace(/<[^>]+>/g, "");
      c.setAttribute("aria-label", "Go to: " + c.title);
      c.onclick = function () { jumpTo(it.id); };
      ledger.appendChild(c);
    });
    panel.appendChild(list);
    var empty = el("div", { "class": "empty", id: "empty" }); empty.hidden = true;
    empty.textContent = "Nothing matches. Clear the search or switch the filter.";
    panel.appendChild(empty);

    var q = ctl.querySelector("#q");
    q.value = query;
    q.oninput = function () { query = q.value.trim().toLowerCase(); applyFilter(); };
    ctl.querySelectorAll(".seg button").forEach(function (b) {
      b.onclick = function () { filter = b.getAttribute("data-f"); applyFilter(); };
    });
    ctl.querySelector("#next").onclick = function () {
      var n = t.items.filter(function (i) { return !done[i.id]; })[0];
      if (!n) return;
      filter = "all"; query = ""; q.value = ""; applyFilter();
      jumpTo(n.id);
    };
    ctl.querySelector("#all").onclick = function () {
      if (!confirm("Mark all " + t.items.length + " items in " + t.name + " as done?")) return;
      t.items.forEach(function (i) { done[i.id] = true; });
      save(KEY_DONE, done); refreshAll();
    };
    ctl.querySelector("#clear").onclick = function () {
      if (!confirm("Clear all check marks in " + t.name + "? Your notes stay.")) return;
      t.items.forEach(function (i) { delete done[i.id]; });
      save(KEY_DONE, done); refreshAll();
    };
    refreshAll();
  }

  function applyFilter() {
    var t = current, shown = 0, groupShown = null, groups = [];
    var rows = panel.querySelectorAll("#list > li");
    rows.forEach(function (li) {
      if (li.getAttribute("data-group")) { groups.push({ li: li, any: false }); return; }
      var id = li.getAttribute("data-id");
      var it = t.items.filter(function (x) { return x.id === id; })[0];
      var ok = (filter === "all" || (filter === "done" ? done[id] : !done[id])) &&
        (!query || it.title.toLowerCase().indexOf(query) !== -1 || it.html.toLowerCase().indexOf(query) !== -1);
      li.hidden = !ok;
      if (ok) { shown++; if (groups.length) groups[groups.length - 1].any = true; }
    });
    groups.forEach(function (g) { g.li.hidden = !g.any; });
    panel.querySelector("#empty").hidden = shown > 0;
    panel.querySelectorAll(".seg button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-f") === filter));
    });
  }

  function refreshAll() {
    var t = current, n = doneCount(t);
    panel.querySelector("#c-n").textContent = n;
    panel.querySelector("#c-t").textContent = "of " + t.items.length + (n === t.items.length && n ? " - track complete" : " done");
    panel.querySelectorAll(".q").forEach(function (li) {
      var on = !!done[li.getAttribute("data-id")];
      li.classList.toggle("done", on);
      li.querySelector("input").checked = on;
    });
    panel.querySelectorAll(".cell").forEach(function (c) {
      c.classList.toggle("on", !!done[c.getAttribute("data-id")]);
    });
    renderNav(); applyFilter();
  }

  function setDone(id, on) {
    if (on) done[id] = true; else delete done[id];
    save(KEY_DONE, done); refreshAll();
  }

  function jumpTo(id) {
    var li = document.getElementById("q-" + id);
    if (!li) return;
    if (li.hidden) { filter = "all"; query = ""; panel.querySelector("#q").value = ""; applyFilter(); }
    li.querySelector("details").open = true;
    li.scrollIntoView({ block: "start" });
    li.classList.add("target");
    setTimeout(function () { li.classList.remove("target"); }, 1600);
  }

  /* ---- export / import ---- */
  document.getElementById("export").onclick = function () {
    var blob = new Blob([JSON.stringify({ done: done, notes: notes }, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "cloud-tracker-progress.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };
  var fileInput = document.getElementById("file");
  document.getElementById("import").onclick = function () { fileInput.click(); };
  fileInput.onchange = function () {
    var f = fileInput.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result);
        if (!j || typeof j.done !== "object") throw new Error("bad file");
        if (!confirm("Replace the progress in this browser with the file's contents?")) return;
        done = j.done || {}; notes = j.notes || {};
        save(KEY_DONE, done); save(KEY_NOTES, notes);
        openTrack(current.id, true);
      } catch (e) { alert("That file is not a progress export from this tracker."); }
    };
    r.readAsText(f);
    fileInput.value = "";
  };

  var start = location.hash.slice(1) || load(KEY_TRACK, "");
  openTrack(byId(start) ? start : tracks[0].id);
  window.addEventListener("hashchange", function () {
    var id = location.hash.slice(1);
    if (byId(id) && id !== current.id) openTrack(id);
  });
})();
</script>
</body>
